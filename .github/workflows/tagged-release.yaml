---
name: "tagged-release"

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "*"

permissions:
  attestations: write
  id-token: write
  contents: write

jobs:
  tagged-release:
    name: tagged-release
    runs-on: ubuntu-24.04
    env:
      CI_BRANCH: release
      PACKAGECLOUD_REPOSITORY: dokku/dokku

    steps:
      # a release is tagged v<version> so that go resolves it as a module
      # version, and a debian version has to start with a digit, so the
      # packages are versioned without the v. The binary reports the tag as it
      # is, which is what a plugin pinning the release compares it against
      - name: Set Package Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >>"$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"

      - name: Get Repository Name
        id: repo-name
        run: |
          echo "REPOSITORY_NAME=$(echo "${{ github.repository }}" | cut -d '/' -f 2)" >> $GITHUB_OUTPUT

      # built without cgo so that the binaries are statically linked. A cgo build
      # links against the glibc of the machine it was built on, and does not
      # start on a server with an older one
      - name: Build binaries
        run: |
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            extension=""
            if [[ "$goos" == "windows" ]]; then
              extension=".exe"
            fi

            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -v -trimpath \
              -ldflags "-s -w -X main.Version=${{ github.ref_name }}" \
              -o "dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-${goos}-${goarch}${extension}"
          done

      - name: Attest Build Provenance - darwin-amd64
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-darwin-amd64
            dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-darwin-arm64
            dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-linux-amd64
            dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-linux-arm64
            dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-windows-amd64.exe

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: .github

      - name: Build Debian Packages
        run: |
          mkdir -p build/linux

          cp dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-linux-amd64 build/linux/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-amd64
          cp dist/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-linux-arm64 build/linux/${{ steps.repo-name.outputs.REPOSITORY_NAME }}-arm64

          bundle exec make "build/deb/${{ steps.repo-name.outputs.REPOSITORY_NAME }}_${VERSION}_arm64.deb"
          bundle exec make "build/deb/${{ steps.repo-name.outputs.REPOSITORY_NAME }}_${VERSION}_amd64.deb"
          cp build/deb/*.deb dist/
        env:
          BUNDLE_GEMFILE: .github/Gemfile

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*

      - name: Release to PackageCloud
        run: bundle exec make release-packagecloud
        env:
          BUNDLE_GEMFILE: .github/Gemfile
          PACKAGECLOUD_TOKEN: ${{ secrets.PACKAGECLOUD_TOKEN }}

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: "true"
