---
name: "test"

# yamllint disable-line rule:truthy
on:
  pull_request:
    branches:
      - "*"
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: go-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go get .
      - run: go test -v ./...

  definitions:
    name: definitions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      # read from the tree rather than listed here, so a new datastore is a
      # definition directory and not also a workflow edit
      - id: list
        run: |
          names="$(ls internal/registry/definitions)"
          filter='split("\n") | map(select(length > 0))'
          matrix="$(jq -R -s -c "$filter" <<<"$names")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  docker-test:
    name: "docker-test (${{ matrix.definition }}, ${{ matrix.backend }})"
    runs-on: ubuntu-24.04
    needs: definitions
    strategy:
      # one broken datastore must not hide the state of the other twenty one
      fail-fast: false
      matrix:
        definition: ${{ fromJSON(needs.definitions.outputs.matrix) }}
        # every definition is exercised through both execution backends, since
        # the whole claim is that they produce the same container
        backend: ["docker", "compose"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go build -o dokku-datastore .
      - id: setup-bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
          assert-version: "2.2.4"
          detik-install: false
          file-install: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # no dokku: the binary needs a data root and a user to own what it writes,
      # which keeps this a check of the definition rather than of dokku
      - run: bats --print-output-on-failure tests/definition
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          DEFINITION: ${{ matrix.definition }}
          DOKKU_DATASTORE_BACKEND: ${{ matrix.backend }}

  backend-agreement:
    name: "backend-agreement (${{ matrix.definition }})"
    runs-on: ubuntu-24.04
    needs: definitions
    strategy:
      fail-fast: false
      matrix:
        definition: ${{ fromJSON(needs.definitions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go build -o dokku-datastore .
      - id: setup-bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          bats-version: "1.14.0"
          assert-version: "2.2.4"
          detik-install: false
          file-install: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # the same definition through both backends, compared as docker sees it:
      # a difference here is a bug in the renderer, since both are handed one
      # set of resolved values
      - run: bats --print-output-on-failure tests/backends.bats
        env:
          BATS_LIB_PATH: ${{ steps.setup-bats.outputs.lib-path }}
          DEFINITION: ${{ matrix.definition }}
