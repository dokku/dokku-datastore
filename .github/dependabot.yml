---
version: 2
updates:
  # one entry per definition, because a definition split by major version has
  # to say which majors it accepts and that cannot be said for a glob. The
  # completeness of this list is a test rather than a convention: a definition
  # missing from here is one nothing watches.
  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/clickhouse"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/couchdb"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/elasticsearch-7"
    schedule:
      interval: "daily"
    # elasticsearch-7 exists to keep services on 7.x running what they were
    # created with, so crossing a major here would empty it of its purpose
    ignore:
      - dependency-name: "elasticsearch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/elasticsearch-8"
    schedule:
      interval: "daily"
    # elasticsearch-8 exists to keep services on 8.x running what they were
    # created with, so crossing a major here would empty it of its purpose
    ignore:
      - dependency-name: "elasticsearch"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/elasticsearch-9"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/graphite"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/mariadb"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/meilisearch"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/memcached"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/mongo"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/mysql"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/nats"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/omnisci"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/postgres-17"
    schedule:
      interval: "daily"
    # postgres-17 exists to keep services on 17.x running what they were
    # created with, so crossing a major here would empty it of its purpose
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/postgres-18"
    schedule:
      interval: "daily"

  # pgvector writes the postgres major as a -pg17 suffix, and dependabot only
  # moves a tag to one with the same suffix, so neither of these can cross a
  # postgres major. A major of pgvector itself is not one of postgres's and is
  # left free to land.
  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/postgres-pgvector-pg17"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/postgres-pgvector-pg18"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/postgres-postgis-pg17"
    schedule:
      interval: "daily"
    # postgis leads its tags with the postgres major, which dependabot reads as
    # the semver major of 17-3.5, so this is held inside it the way postgres-17
    # is
    ignore:
      - dependency-name: "postgis/postgis"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/postgres-postgis-pg18"
    schedule:
      interval: "daily"

  # the same -pg17 suffix as pgvector, so held inside its postgres major by the
  # suffix rather than by an ignore. Both majors are bumped in one pull request,
  # since an upgrade from one onto the other only restores onto the same
  # timescaledb version
  - package-ecosystem: "docker"
    directories:
      - "/internal/registry/definitions/postgres-timescaledb-pg17"
      - "/internal/registry/definitions/postgres-timescaledb-pg18"
    schedule:
      interval: "daily"
    groups:
      timescaledb:
        patterns:
          - "timescale/timescaledb"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/pushpin"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/rabbitmq"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/redis"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/rethinkdb"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/solr-7"
    schedule:
      interval: "daily"
    # solr-7 exists to keep services on 7.x running what they were
    # created with, so crossing a major here would empty it of its purpose
    ignore:
      - dependency-name: "solr"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/solr-8"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directory: "/internal/registry/definitions/typesense"
    schedule:
      interval: "daily"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # dokku's plugins/common is a module nested in a repository whose root is
      # not one, and it publishes no tags of its own, so it can only ever be
      # required at a pseudo-version. Dependabot reads the repository's tags as
      # if they were the module's, resolves github.com/dokku/dokku@v0.38.28, and
      # fails because that is not a module containing this package - which fails
      # the whole gomod run and takes every other go update down with it.
      - dependency-name: "github.com/dokku/dokku/plugins/common"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10

  - package-ecosystem: "bundler"
    directory: "/.github"
    schedule:
      interval: "daily"

  # the root images are what the tool is built and shipped in rather than a
  # datastore, so they drop the docker label to stay out of the release notes'
  # datastore section
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
